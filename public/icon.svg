<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="188" stroke="#1e293b" stroke-width="8" fill="none" opacity="0.6" />
  
  <!-- Glowing accent arc -->
  <circle cx="256" cy="256" r="188" stroke="url(#ringGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="885" stroke-dashoffset="240" filter="url(#glow)" />

  <!-- Hour ticks -->
  <line x1="256" y1="88" x2="256" y2="104" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="424" y1="256" x2="408" y2="256" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="424" x2="256" y2="408" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="88" y1="256" x2="104" y2="256" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Hour hand (short, cyan) -->
  <line x1="256" y1="256" x2="190" y2="175" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- Minute hand (longer, white/slate) -->
  <line x1="256" y1="256" x2="340" y2="150" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />

  <!-- Second hand (orange/amber with counterweight) -->
  <line x1="256" y1="290" x2="256" y2="115" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="115" r="7" fill="#f59e0b" filter="url(#glow)" />

  <!-- Center cap -->
  <circle cx="256" cy="256" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="5" />
  <circle cx="256" cy="256" r="4" fill="#ffffff" />
</svg>
